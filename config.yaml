# ──────────────────────────────────────────────────────────────────────
# ASG (Aldertech Storage Governor) — Configuration
# ──────────────────────────────────────────────────────────────────────
# Copy this file to /etc/asg/config.yaml and edit it.
# All settings have sensible defaults for a 4-core system (e.g. Pi 5).
# ──────────────────────────────────────────────────────────────────────

# ── Pool ─────────────────────────────────────────────────────────────
# Mount point of the BTRFS filesystem to manage.
# The UUID is auto-detected from this mount point at startup and
# verified before every operation. You can optionally pin a UUID
# below to prevent accidental operation on a different pool.
pool:
  mount: "/mnt/media_pool"
  # uuid: ""                  # Optional. If set, must match the mounted UUID.

# ── Scrub Throttling ────────────────────────────────────────────────
# The scrub controller uses two sets of thresholds. The PRE-FLIGHT set
# (load_threshold, io_threshold_percent) decides whether to start or
# resume a scrub at all. The RUNNING set (load_threshold_running,
# write_iops_threshold) decides whether to pause a scrub that is already
# in progress: at that point load average and per-device I/O utilisation
# are dominated by the scrub itself (its checksum-verification kworkers
# add ~1.0 load per pool device, and its sequential reads keep the
# drives busy), so the pre-flight thresholds would pause it immediately.
scrub:
  # PRE-FLIGHT. 1-minute load average above which a scrub will not be
  # started or resumed. Set relative to your CPU core count
  # (e.g. 3.0 for a 4-core Pi 5).
  load_threshold: 3.0

  # PRE-FLIGHT. Per-device I/O utilisation percentage; a scrub will not
  # be started or resumed if any pool drive exceeds this. Calculated
  # from /proc/diskstats over a 2-second sample window. Not applied
  # while a scrub is running.
  io_threshold_percent: 40.0

  # RUNNING. 1-minute load average above which an in-progress scrub is
  # paused. Must clear the scrub's own baseline: roughly 1.0 per pool
  # device (about 4-5 on a 4-drive pool), plus headroom for other work.
  load_threshold_running: 7.0

  # RUNNING. Aggregate WRITE IOPS across the pool devices above which an
  # in-progress scrub is paused. A scrub is sequential-read-only (bar
  # rare checksum repair), so sustained writes indicate genuine external
  # load that total device-busy time cannot separate from the scrub's
  # own reads.
  write_iops_threshold: 600.0

  # How often (seconds) to re-check system load during a scrub.
  poll_interval_seconds: 30

  # Let the scrub run uninterrupted for this many seconds before
  # the first throttle check. Prevents thrashing on transient spikes.
  grace_period_seconds: 60

# ── Capacity Warnings ──────────────────────────────────────────────
capacity:
  # Warn when allocated data chunks exceed this percentage fullness.
  chunk_fullness_warn_percent: 90.0

  # Warn when real free space drops below this percentage of the
  # usable RAID1 ceiling.
  free_space_warn_percent: 10.0

  # Warn when metadata chunks exist on fewer than this many devices.
  # For a 4-drive RAID1 pool, 3 is recommended. For 2-drive pools,
  # set this to 2.
  metadata_min_device_count: 3

# ── Snapshots ───────────────────────────────────────────────────────
snapshots:
  # Directory for pre-backup read-only snapshots.
  # Created under the pool mount point.
  directory: ".snapshots"

  # Delete snapshots older than this many days.
  retention_days: 3

# ── Notifications (optional) ───────────────────────────────────────
# All notification backends are optional. Remove or comment out any
# you don't use. If no backends are configured, the manager logs to
# stdout only (captured by cron or journalctl).
notifications:
  # discord:
  #   webhook_url: "https://discord.com/api/webhooks/..."

  # ntfy:
  #   url: "https://ntfy.sh/your-topic"
  #   token: ""                # Optional authentication token

  # gotify:
  #   url: "https://gotify.example.com"
  #   token: "your-app-token"

# ── State Files ─────────────────────────────────────────────────────
# Where to store persistent state (error deduplication, capacity
# history). Defaults to /var/lib/asg if not set.
# state_dir: "/var/lib/asg"
